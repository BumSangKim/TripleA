version: sector_component_sector_portfolios_current_scope_test_v1
semantics: diagnostic_sector_sleeve_fixture
source_taxonomy: config/sector_taxonomy.yaml
not_for:
  - account_strategy
  - order_candidate
  - broker_execution
  - production_parameter_approval
portfolios:
