# config/indicators.yaml
# 단일 출처 지표 메타데이터 정의
# 모든 모듈(summarizer, monitor, telegram_sender)이 이 파일을 참조한다.
#
# 필드 설명:
#   label        : 텔레그램·차트에 표시할 한국어 레이블
#   unit         : 값 단위
#   frequency    : daily | weekly | monthly | quarterly
#   stale_days   : 이 일수 이상 업데이트 없으면 stale로 간주
#   source       : 주 수집 소스 (정보용)
#   layer        : macro | korea | commodity | us | supply_chain | ai_bottleneck | power | equity
#   chart        : true이면 기본 차트에 포함

# ── 한국 매크로 ─────────────────────────────────────────────────────────────
indicators:
  CPI:
    label: "소비자물가지수"
    unit: "pt(2020=100)"
    frequency: monthly
    stale_days: 40
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: true

  PPI:
    label: "생산자물가지수"
    unit: "pt(2020=100)"
    frequency: monthly
    stale_days: 40
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

  USD_KRW:
    label: "원/달러 환율"
    unit: "원"
    frequency: daily
    stale_days: 3
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: true

  BASE_RATE:
    label: "한국 기준금리"
    unit: "%"
    frequency: monthly
    stale_days: 40
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

  KOSPI:
    label: "코스피"
    unit: "pt"
    frequency: daily
    stale_days: 3
    source: "Yahoo:^KS11"
    layer: korea
    chart: true

  KOSDAQ:
    label: "코스닥"
    unit: "pt"
    frequency: daily
    stale_days: 3
    source: "Yahoo:^KQ11"
    layer: korea
    chart: false

  UNEMPLOYMENT:
    label: "실업률"
    unit: "%"
    frequency: monthly
    stale_days: 40
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

  BOND_3Y:
    label: "국고채(3년)"
    unit: "%"
    frequency: daily
    stale_days: 3
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

  GDP_GROWTH:
    label: "경제성장률(전기比)"
    unit: "%"
    frequency: quarterly
    stale_days: 100
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

  CSI:
    label: "소비자심리지수"
    unit: ""
    frequency: monthly
    stale_days: 40
    source: "ECOS:KeyStatisticList"
    layer: korea
    chart: false

# ── 국제 원자재 ─────────────────────────────────────────────────────────────
  DUBAI_OIL:
    label: "두바이유"
    unit: "USD/bbl"
    frequency: daily
    stale_days: 3
    source: "Yahoo:BZ=F"
    layer: commodity
    chart: true

  GOLD:
    label: "금 가격"
    unit: "USD/oz"
    frequency: daily
    stale_days: 3
    source: "Yahoo:GC=F"
    layer: commodity
    chart: true

  WTI:
    label: "WTI 국제유가"
    unit: "USD/bbl"
    frequency: daily
    stale_days: 3
    source: "Yahoo:CL=F / FRED:DCOILWTICO"
    layer: commodity
    chart: true

# ── 미국 매크로 ─────────────────────────────────────────────────────────────
  US_CPI:
    label: "미국 CPI"
    unit: "index"
    frequency: monthly
    stale_days: 40
    source: "FRED:CPIAUCSL"
    layer: us
    chart: false

  FED_RATE:
    label: "미국 기준금리"
    unit: "%"
    frequency: monthly
    stale_days: 40
    source: "FRED:FEDFUNDS"
    layer: us
    chart: false

  US10Y:
    label: "미국 10Y 국채금리"
    unit: "%"
    frequency: daily
    stale_days: 3
    source: "Yahoo:^TNX / FRED:DGS10"
    layer: us
    chart: false

  DXY:
    label: "달러인덱스(DXY·ICE)"
    unit: "index"
    frequency: daily
    stale_days: 3
    source: "Yahoo:DX-Y.NYB"
    layer: us
    chart: false

  USD_INDEX:
    label: "달러무역가중지수(DTWEXBGS)"
    unit: "index"
    frequency: weekly
    stale_days: 10
    source: "FRED:DTWEXBGS"
    layer: us
    chart: false

# ── 공급망 ─────────────────────────────────────────────────────────────────
  PMI_SDT:
    label: "공급망압력(GSCPI·PMI)"
    unit: "σ"
    frequency: monthly
    stale_days: 40
    source: "NY_FED:GSCPI"
