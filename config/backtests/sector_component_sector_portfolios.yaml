portfolio_version: sector_trade_reference_portfolios_v1
as_of_date: '2026-06-01'
classification: trade_reference_model_portfolio
purpose: Sector sleeve portfolios for backtest, UI diagnostics, and human-reviewed trading reference. Not an automatic order
  candidate.
global_policy:
  not_personalized_investment_advice: true
  requires_user_review_before_order: true
  automatic_execution_allowed: false
  score_flow_required: true
  hard_constraints_first: true
  backtest_before_execution: true
  must_include_categories:
  - domestic_stock
  - domestic_etf
  - overseas_stock
  - overseas_etf
  base_weights_must_sum_to: 1.0
  rebalance_frequency_reference: monthly_or_score_event
  max_single_asset_reference_weight: 0.12
  max_single_etf_reference_weight: 0.15
  lookthrough_overlap_control: true
  risk_gate:
    data_quality_below_0_70: REVIEW_REQUIRED
    missing_price_or_fx: REVIEW_REQUIRED
    spread_or_liquidity_anomaly: REVIEW_REQUIRED
    earnings_event_or_policy_event: REVIEW_REQUIRED
    drawdown_or_volatility_spike: RISK_REDUCE_OR_HOLD
  account_constraints_to_check:
  - taxable
  - isa
  - pension
  - irp
  - foreign_stock_tradability
  - foreign_etf_tax_treatment
  - domestic_listed_foreign_etf_tax_treatment
  - minimum_order_unit
  - broker_product_support
  - currency_conversion_cost
  - withholding_tax_and_dividend_policy
